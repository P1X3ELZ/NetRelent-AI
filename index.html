<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetRelent AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0a000f;
            background-image: radial-gradient(circle at center, #1a0033 0%, #0a000f 100%);
            color: #e0b0ff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        header {
            margin-top: 40px;
            letter-spacing: 8px;
            font-size: 24px;
            font-weight: 300;
            color: #bc13fe;
            text-shadow: 0 0 15px #bc13fe;
            text-transform: uppercase;
        }

        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: none;
        }
        #chat-container::-webkit-scrollbar { display: none; }

        .message {
            max-width: 80%;
            padding: 14px 22px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            white-space: pre-line;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            align-self: flex-end;
            background: rgba(188, 19, 254, 0.12);
            border: 1px solid rgba(188, 19, 254, 0.35);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #d8c5e3;
            border-bottom-left-radius: 4px;
        }

        form {
            width: 100%;
            max-width: 750px;
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .input-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 10px 12px 10px 30px;
            transition: all 0.4s ease;
        }

        .input-container:focus-within {
            border-color: rgba(188, 19, 254, 0.5);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.25);
            background: rgba(255, 255, 255, 0.04);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            padding: 10px 0;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .send-btn {
            background: #bc13fe;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px #bc13fe;
            transition: all 0.2s ease;
        }

        .send-btn:hover { 
            transform: scale(1.08); 
            box-shadow: 0 0 22px #bc13fe;
        }
        .send-btn svg { fill: white; width: 18px; height: 18px; }
    </style>
</head>
<body>

    <header>NetRelent AI</header>

    <div id="chat-container"></div>

    <form id="chat-form">
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Initiate..." autocomplete="off" required>
            <button type="submit" class="send-btn">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </form>

    <script>
        const chatForm = document.getElementById('chat-form');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage(text, 'user-msg');

            try {
                const response = await fetch('https://netrelent-ai.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: text })
                });
                
                if (!response.ok) {
                    appendMessage(`Response Error: Code ${response.status}`, 'ai-msg');
                    return;
                }
                
                const data = await response.json();
                appendMessage(data.answer, 'ai-msg');
            } catch (error) {
                appendMessage("Uplink Interrupted: Failed to communicate with live core.", 'ai-msg');
            }
        });
    </script>
</body>
</html>
