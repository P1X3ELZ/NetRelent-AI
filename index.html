<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NetRelent AI | Predator Terminal</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .terminal { width: 80%; max-width: 800px; background: #000; border: 1px solid #00ff41; padding: 20px; box-shadow: 0 0 20px #00ff4133; }
        h1 { font-size: 1.2rem; border-bottom: 1px solid #00ff41; padding-bottom: 10px; margin-top: 0; }
        input { background: transparent; border: none; border-bottom: 1px solid #00ff41; color: #00ff41; width: 100%; font-family: inherit; font-size: 1rem; outline: none; margin: 20px 0; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        #output { margin-top: 20px; color: #008f11; height: 200px; overflow-y: auto; border: 1px solid #333; padding: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>PREDATOR ENGINE v1.0 // UPLINK: ONLINE</h1>
        <div id="output">SYSTEM STATUS: IDLE... AWAITING COORDINATES</div>
        <input type="text" id="query" placeholder="TYPE QUESTION AND PRESS EXECUTE..." onkeypress="if(event.key === 'Enter') sendQuery()">
        <button onclick="sendQuery()">EXECUTE</button>
    </div>

    <script>
        async function sendQuery() {
            const query = document.getElementById('query').value;
            const output = document.getElementById('output');
            if(!query) return;

            output.innerHTML += `<br>> INITIALIZING SEARCH: ${query}...`;
            
            try {
                const response = await fetch('https://netrelent-ai.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: query })
                });
                const data = await response.json();
                output.innerHTML += `<br>> RESPONSE: ${data.answer}`;
            } catch (err) {
                output.innerHTML += `<br>> ERROR: CONNECTION TIMEOUT`;
            }
            document.getElementById('query').value = '';
            output.scrollTop = output.scrollHeight;
        }
    </script>
</body>
</html>
